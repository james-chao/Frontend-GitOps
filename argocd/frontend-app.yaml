apiVersion: argoproj.io/v1alpha1

kind: Application

metadata:
  name: frontend
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/james-chao/Frontend-GitOps.git
    targetRevision: main
    path: production

  destination:
    server: https://kubernetes.default.svc
    namespace: production

  syncPolicy:
    automated:
      prune: true
      selfHeal: true